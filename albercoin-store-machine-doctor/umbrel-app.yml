gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: AlbercoinDev
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
dependencies: []
releaseNotes: >-
  Actualiza el runtime Python a la imagen 3.12-slim vigente y las dependencias
  FastAPI 0.163.1 y Uvicorn 0.54.0. Mantiene las funciones de diagnóstico de
  CPU, los montajes de host y el formato de los informes; no hay migración de
  datos.
