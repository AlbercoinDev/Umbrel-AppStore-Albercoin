manifestVersion: 1
id: albercoin-store-frigate
storage:
  dataRoot: data
category: bitcoin
name: Frigate Silent Payments
version: "1.6.1-14"
tagline: Servidor Electrum para Silent Payments (BIP352)
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-frigate/icon.svg
description: >-
  **Primer arranque:** abre el panel y confirma la altura inicial. Frigate no
  descarga el binario ni empieza a indexar hasta que lo hagas. Puedes usar el
  historial completo desde Taproot (bloque 709632 en mainnet), una altura
  concreta o una fecha UTC.


  Frigate es un servidor Electrum para Bitcoin Silent Payments (BIP352).
  Realiza el escaneo en el servidor con claves efímeras del cliente y devuelve
  las transacciones encontradas mediante una extensión del protocolo JSON-RPC
  de Electrum.


  Este paquete conecta Frigate con tu nodo Bitcoin Core y usa Electrs como
  backend para las peticiones Electrum que no son de Silent Payments. Las
  wallets se conectan al puerto `50005` del nodo; el panel se abre en el puerto
  de la app y está protegido por el inicio de sesión de Umbrel.


  El índice DuckDB, el runtime descargado y las cachés se guardan en el
  directorio de datos de la app y se excluyen de las copias de seguridad.
  Cambiar la altura inicial borra y reconstruye el índice.
releaseNotes: >-
  Revisión 14 del paquete Umbrel para Frigate 1.6.1. El log deja de borrarse en
  cada arranque: se conserva, rota en caliente al superar 25 MB manteniendo los
  últimos 20 MB por líneas completas, y el panel y el widget solo evalúan la
  ejecución actual. Un watchdog reinicia Frigate si el log deja de recibir
  actividad durante 20 minutos con el servicio listo, y el panel avisa. Si
  Frigate termina de forma inesperada, el contenedor sale con código 1 para que
  Docker lo reinicie. No cambia el binario de Frigate, la configuración ni el
  índice: no hace falta reindexar.
developer: Sparrow Wallet
website: https://sparrowwallet.com/
dependencies:
  - bitcoin
  - electrs
repo: https://github.com/sparrowwallet/frigate
support: https://github.com/sparrowwallet/frigate/issues
port: 2125
gallery:
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-frigate/gallery/1.png
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-frigate/gallery/2.png
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-frigate/gallery/3.png
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Albercoin
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
backupIgnore:
  - data/frigate/db
  - data/frigate/*/db
  - data/frigate/runtime
  - data/frigate/cache
  - data/frigate/*/cache
  - data/frigate/config.toml
  - data/frigate/*/config.toml
  - data/frigate/frigate.log
  - data/frigate/*/frigate.log
widgets:
  - id: "status"
    type: "three-stats"
    refresh: "10s"
    endpoint: "web:80/api/widget/status"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Estado"
          text: "Listo"
          subtext: "Frigate"
        - title: "Progreso"
          text: "100%"
          subtext: "indexación"
        - title: "Altura"
          text: "923,610"
          subtext: "bloques"
