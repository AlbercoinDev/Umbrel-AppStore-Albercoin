manifestVersion: 1
id: albercoin-store-simplex-chat-cli
category: social
name: SimpleX Chat CLI
version: "1.0.5"
tagline: Private messaging with web management and optional agents
description: >-
  Run SimpleX Chat CLI independently on your Umbrel. Manage your profile,
  contact address, connection requests and text conversations from a web interface.


  Your databases, settings and local backups persist in this app's own data directory.
  Local backups expire automatically after 10 days. Optional scheduled backups and
  age encryption are available; keep downloaded backups and private keys outside
  the node if you need longer retention.
  An optional authenticated WebSocket connector supports Hermes Agent and other
  SimpleX API clients. Hermes is not required. Text messaging is the supported
  integration scope for this release; attachments and calls are not included.


  Log in with the app password shown by Umbrel. Integration credentials grant access
  to the SimpleX API: share them only with trusted clients. No integration port is
  published on your local network.
developer: Albercoin
website: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
repo: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
support: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin/issues
port: 2191
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-simplex-chat-cli/icon.svg
gallery: []
path: ""
defaultUsername: "admin"
defaultPassword: "$APP_PASSWORD"
deterministicPassword: true
dependencies: []
submitter: AlbercoinDev
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
releaseNotes: >-
  Versión 1.0.5: detecta automáticamente servidores clearnet y onion e incluye
  Tor local para conectar con servidores propios onion sin configurar un proxy.
  Si una URI anuncia ambas redes se selecciona onion sin fallback silencioso.
  El panel muestra la red, ruta, resultado y fecha de la última comprobación.
  Comprueba SMP y XFTP al guardar y permite repetir la prueba manualmente.
  Añade logs clasificados de red y Tor, sin URI completas ni credenciales.
  Las pruebas usan recursos temporales; una interrupción puede impedir su limpieza.
  Una prueba correcta no acredita entrega de mensajes. Conserva los datos y
  SimpleX Chat CLI v7.0.3; no modifica Hermes. Se mantiene la retención de
  copias locales de 10 días: descarga las que quieras conservar fuera del nodo.
