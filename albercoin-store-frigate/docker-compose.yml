            .status {{ display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 999px; background: rgba(92,200,255,.14); border: 1px solid rgba(92,200,255,.32); color: #9ee3ff; font-weight: 700; }}
            .dot {{ width: 10px; height: 10px; border-radius: 999px; background: #5cc8ff; box-shadow: 0 0 18px #5cc8ff; }}
            .connections {{ display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 22px; }}
            .connection {{ padding: 18px; border-radius: 16px; background: rgba(92,200,255,.08); border: 1px solid rgba(92,200,255,.18); }}
            .endpoint {{ display: block; overflow-wrap: anywhere; font-size: 15px; line-height: 1.45; }}
            .copy-row {{ display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }}
            .copy-button {{ padding: 8px 10px; border-radius: 8px; font-size: 13px; }}
            .progress {{ height: 16px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(92,200,255,.22); margin: 10px 0 18px; }}
            .progress-fill {{ height: 100%; min-width: 8px; border-radius: inherit; background: linear-gradient(90deg, #5cc8ff, #75ffc8); box-shadow: 0 0 24px rgba(92,200,255,.45); }}
            .progress-indeterminate .progress-fill {{ width: 35%; animation: pulse 1.8s ease-in-out infinite alternate; }}
            @keyframes pulse {{ from {{ transform: translateX(-20%); opacity: .55; }} to {{ transform: translateX(190%); opacity: 1; }} }}
            dl {{ display: grid; grid-template-columns: 170px 1fr; gap: 10px 18px; margin: 0; color: #c6d8e8; }}
            dt {{ color: #8fb0c8; }}
            dd {{ margin: 0; overflow-wrap: anywhere; }}
            pre {{ overflow: auto; white-space: pre-wrap; color: #cfeeff; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 16px; max-height: 360px; font-size: 13px; line-height: 1.45; }}
            .field {{ display: grid; grid-template-columns: 240px 1fr; gap: 14px 18px; padding: 18px 0; border-top: 1px solid rgba(255,255,255,.1); }}
            .help {{ color: #a9bfd1; font-size: 14px; line-height: 1.45; margin-top: 8px; }}
            .warning {{ border-color: rgba(255,190,92,.36); background: rgba(255,190,92,.1); color: #ffe0a3; }}
            @media (max-width: 760px) {{ .connections, .field {{ grid-template-columns: 1fr; }} dl {{ grid-template-columns: 1fr; }} }}
        </style>
        <script>
          function copyValue(value, button) {{
            function done() {{ const old = button.textContent; button.textContent = '{escape(tr(lang, "copied"))}'; setTimeout(() => button.textContent = old, 1200); }}
            if (navigator.clipboard && window.isSecureContext) {{ navigator.clipboard.writeText(value).then(done); return; }}
            const area = document.createElement('textarea'); area.value = value; document.body.appendChild(area); area.select(); document.execCommand('copy'); document.body.removeChild(area); done();
          }}
          function confirmConfigSave(form) {{
            if (form.dataset.setup === 'true') return confirm('{"¿Confirmar la altura elegida e iniciar la indexación? Una altura posterior al inicio puede omitir pagos antiguos." if lang == "es" else "Confirm the selected height and start indexing? A later start height can omit older payments."}');
            const oldHeight = form.dataset.currentStartHeight || '';
            const newHeight = (form.elements['START_HEIGHT'].value || '').trim();
            if (oldHeight !== newHeight) {{
              return confirm('{escape(tr(lang, "confirm_start_height"))}');
            }}
            return confirm('{escape(tr(lang, "confirm_restart"))}');
          }}
        </script>
        </head>
        <body><main>{body}</main></body></html>'''

        def status_body(lang, message=""):
            settings = read_settings()
            if settings["SETUP_REQUIRED"] == "true":
                return config_body(lang, message)
            initial = settings["AUTO_PROFILE"] == "true" and not (DATA_DIR / ".efficient-profile").exists()
            if initial:
                profile = "Indexación inicial: al terminar se reiniciará con el perfil eficiente." if lang == "es" else "Initial indexing: will restart with the efficient profile when complete."
                if settings["CACHE_SIZE"] == "1M":
                    settings["CACHE_SIZE"] = "10M"
            else:
                profile = "Perfil de funcionamiento configurado (sin aumento temporal de memoria)." if lang == "es" else "Configured operating profile (no temporary memory boost)."
            network = os.environ.get("APP_BITCOIN_NETWORK", "mainnet")
            lpath = LOG_FILE
            log_lines = read_log(lpath)
            status_key, detail_key = status_from_log(log_lines)
            status = tr(lang, status_key)
            detail = tr(lang, detail_key)
            is_ready = status_key == "status_ready"
            port = os.environ.get("APP_FRIGATE_ELECTRUM_PORT", "50005")
            clearnet_host = os.environ.get("DEVICE_DOMAIN_NAME", "umbrel.local")
            onion_host = TOR_HOSTNAME_FILE.read_text().strip() if TOR_HOSTNAME_FILE.exists() else tr(lang, "onion_generating")
            onion_detail = tr(lang, "onion_ready") if onion_host.endswith(".onion") else tr(lang, "onion_waiting")
            restart_msg = f'<div class="card warning"><p>{escape(tr(lang, "restart_requested"))}</p></div>' if RESTART_FILE.exists() else ""
            msg = f'<div class="card warning"><p>{escape(message)}</p></div>' if message else restart_msg
            progress_label, progress_value, start_label, indexed_block, tip_block = progress_info(log_lines, network, settings["START_HEIGHT"], is_ready, lang)
            progress_bar = f'<div class="progress"><div class="progress-fill" style="width: {escape(progress_value or "35")}%"></div></div>' if progress_value else '<div class="progress progress-indeterminate"><div class="progress-fill"></div></div>'
            return f'''
            <h1>Frigate</h1>
            <nav><a href="/">{escape(tr(lang, "status"))}</a><a href="/config">{escape(tr(lang, "configuration"))}</a></nav>
            {msg}
            <div class="status"><span class="dot"></span>{escape(status)}</div>
            <p>{escape(detail)}</p>
            <p class="help">{escape(profile)}</p>
            <div class="card"><h2>{escape(tr(lang, "indexing_progress"))}</h2>{progress_bar}<dl><dt>{escape(tr(lang, "progress"))}</dt><dd><code>{escape(progress_label)}</code></dd><dt>{escape(tr(lang, "start_block"))}</dt><dd><code>{escape(start_label)}</code></dd><dt>{escape(tr(lang, "indexed_block"))}</dt><dd><code>{escape(indexed_block)}</code></dd><dt>{escape(tr(lang, "chain_tip"))}</dt><dd><code>{escape(tip_block)}</code></dd></dl></div>
            <div class="connections">
              <div class="connection"><h2>{escape(tr(lang, "clearnet"))}</h2><dl><dt>{escape(tr(lang, "host"))}</dt><dd><div class="copy-row"><code class="endpoint">{escape(clearnet_host)}</code><button class="copy-button" onclick="copyValue('{escape(clearnet_host)}', this)">{escape(tr(lang, "copy"))}</button></div></dd><dt>{escape(tr(lang, "port"))}</dt><dd><div class="copy-row"><code>{escape(port)}</code><button class="copy-button" onclick="copyValue('{escape(port)}', this)">{escape(tr(lang, "copy"))}</button></div></dd></dl><p>{escape(tr(lang, "clearnet_help"))}</p></div>
              <div class="connection"><h2>{escape(tr(lang, "tor_service"))}</h2><dl><dt>{escape(tr(lang, "host"))}</dt><dd><div class="copy-row"><code class="endpoint">{escape(onion_host)}</code><button class="copy-button" onclick="copyValue('{escape(onion_host)}', this)">{escape(tr(lang, "copy"))}</button></div></dd><dt>{escape(tr(lang, "port"))}</dt><dd><div class="copy-row"><code>{escape(port)}</code><button class="copy-button" onclick="copyValue('{escape(port)}', this)">{escape(tr(lang, "copy"))}</button></div></dd></dl><p>{escape(onion_detail)}</p></div>
            </div>
            <div class="card"><dl><dt>{escape(tr(lang, "bitcoin_network"))}</dt><dd><code>{escape(network)}</code></dd><dt>{escape(tr(lang, "configured_start_block"))}</dt><dd><code>{escape(settings["START_HEIGHT"] or tr(lang, "default_suffix"))}</code></dd><dt>{escape(tr(lang, "cache_size"))}</dt><dd><code>{escape(settings["CACHE_SIZE"])}</code></dd><dt>{escape(tr(lang, "compute_backend"))}</dt><dd><code>{escape(settings["COMPUTE_BACKEND"])}</code></dd><dt>{escape(tr(lang, "log_file"))}</dt><dd><code>{escape(str(lpath))}</code></dd><dt>{escape(tr(lang, "updated"))}</dt><dd>{escape(time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime()))}</dd></dl></div>
            <div class="card"><p>{escape(tr(lang, "latest_logs"))}</p><pre>{escape(latest_lines(log_lines, lang))}</pre></div>
            '''

        def config_body(lang, message="", values=None):
            settings = read_settings() if values is None else values
            setup = settings["SETUP_REQUIRED"] == "true"
            es = lang == "es"
            setup_notice = ("Frigate está detenido. Elige la altura inicial y confirma para empezar. Vacío: historial completo desde Taproot (709632 en mainnet; 0 en redes de prueba). Una altura posterior puede omitir pagos antiguos. La indexación inicial usa temporalmente caché 10M y DuckDB 2GB; al terminar reinicia una vez con los valores de abajo. El límite DuckDB no es el consumo total de la app." if es else "Frigate is stopped. Choose a start height and confirm to begin. Empty: complete history from Taproot (709632 on mainnet; 0 on test networks). A later height may omit older payments. Initial indexing temporarily uses a 10M cache and 2GB DuckDB pool, then restarts once with the settings below. DuckDB's limit is not the app's total RAM usage.")
            msg = f'<div class="card warning"><p>{escape(message)}</p></div>' if message else ""
            fields = []
            for key in FIELDS:
                label = tr(lang, f"field_{key}_label")
                help_text = tr(lang, f"field_{key}_help")
                value = settings.get(key, DEFAULTS[key])
                if key == "COMPUTE_BACKEND":
                    control = '<select name="COMPUTE_BACKEND">' + ''.join(f'<option value="{v}" {"selected" if value == v else ""}>{v}</option>' for v in ["AUTO", "GPU", "CPU"]) + '</select>'
                elif key == "METRICS_ENABLED":
                    control = '<select name="METRICS_ENABLED">' + ''.join(f'<option value="{v}" {"selected" if value == v else ""}>{v}</option>' for v in ["true", "false"]) + '</select>'
                else:
                    placeholder = tr(lang, "default_suffix") if key == 'START_HEIGHT' else DEFAULTS[key]
                    control = f'<input name="{key}" value="{escape(value)}" placeholder="{escape(placeholder)}">'
                warning = f'<p class="help"><strong>{escape(tr(lang, "important"))}</strong> {escape(tr(lang, "start_height_warning"))}</p>' if key == "START_HEIGHT" else ""
                if key == "START_HEIGHT":
                    control += ('<p class="help">' + ("O busca por fecha (UTC):" if es else "Or find by date (UTC):") + '</p><input type="date" id="block-date"><button type="button" id="find-block">' + ("Buscar bloque" if es else "Find block") + '</button><p class="help" id="date-result" role="status"></p>')
                fields.append(f'<div class="field"><div><h2>{escape(label)}</h2><p class="help"><code>{escape(key)}</code></p></div><div>{control}<p class="help">{escape(help_text)}</p>{warning}</div></div>')
            return f'''
            <h1>{escape(tr(lang, "configuration"))}</h1>
            <nav><a href="/">{escape(tr(lang, "status"))}</a><a href="/config">{escape(tr(lang, "configuration"))}</a></nav>
            {msg}
            <div class="card warning"><p>{escape(setup_notice if setup else tr(lang, "config_notice"))}</p></div>
            <form method="post" action="/config" class="card" data-setup="{str(setup).lower()}" data-current-start-height="{escape(settings['START_HEIGHT'])}" onsubmit="return confirmConfigSave(this)">
              {''.join(fields)}
              <p><button type="submit">{('Confirmar e iniciar indexación' if es else 'Confirm and start indexing') if setup else escape(tr(lang, "save_configuration"))}</button></p>
            </form>
            <script>
            document.getElementById('find-block').onclick = async function() {{
              const result = document.getElementById('date-result');
              const date = document.getElementById('block-date').value;
              if (!date) return;
              this.disabled = true;
              result.textContent = {'"Buscando en Bitcoin Core y Electrs…"' if es else '"Searching Bitcoin Core and Electrs…"'};
              try {{
                const response = await fetch('/api/block-date?date=' + encodeURIComponent(date));
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                document.querySelector('[name="START_HEIGHT"]').value = data.height;
                result.textContent = data.height + ' · ' + data.source + ' · ' + data.block_time + ' UTC. ' + {'"Incluye un margen de 144 bloques hacia atrás. Revisa la altura antes de confirmar."' if es else '"Includes a 144-block lookback margin. Review the height before confirming."'};
              }} catch (error) {{ result.textContent = error.message; }}
              finally {{ this.disabled = false; }}
            }};
            </script>
            '''

        def core_rpc(method, params):
            host = os.environ["APP_BITCOIN_NODE_IP"]
            port = os.environ["APP_BITCOIN_RPC_PORT"]
            credentials = os.environ["APP_BITCOIN_RPC_USER"] + ":" + os.environ["APP_BITCOIN_RPC_PASS"]
            request = urllib.request.Request(
                f"http://{host}:{port}",
                data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params}).encode(),
                headers={"Authorization": "Basic " + base64.b64encode(credentials.encode()).decode(), "Content-Type": "application/json"},
            )
            with urllib.request.urlopen(request, timeout=4) as response:
                payload = json.load(response)
            if payload.get("error"):
                raise ValueError("RPC unavailable")
            return payload["result"]

        def search_height(target, tip, header, floor, deadline):
            # Median time past is monotonic on a valid chain, unlike raw timestamps.
            low, high = floor, tip
            while low < high:
                if time.monotonic() > deadline:
                    raise TimeoutError("Date search timed out")
                mid = (low + high) // 2
                if header(mid)[1] < target:
                    low = mid + 1
                else:
                    high = mid
            height = max(floor, low - 144)
            return height, header(height)[0]

        def find_with_core(target, floor, deadline):
            info = core_rpc("getblockchaininfo", [])
            if info.get("initialblockdownload") or info["blocks"] < info.get("headers", info["blocks"]):
                raise ValueError("Bitcoin Core is still syncing")
            tip = info["blocks"]
            if tip < floor:
                raise ValueError("Chain has not reached the start height")
            def header(height):
                block = core_rpc("getblockheader", [core_rpc("getblockhash", [height])])
                return block["time"], block["mediantime"]
            if header(tip)[0] < target:
                raise ValueError("Date is beyond the available chain")
            return search_height(target, tip, header, floor, deadline)

        def find_with_electrum(target, floor, deadline):
            with socket.create_connection((os.environ["APP_ELECTRS_NODE_IP"], int(os.environ["APP_ELECTRS_NODE_PORT"])), timeout=4) as connection:
                connection.settimeout(4)
                with connection.makefile("rwb") as stream:
                    request_id = 0
                    def rpc(method, params):
                        nonlocal request_id
                        request_id += 1
                        stream.write((json.dumps({"jsonrpc": "2.0", "id": request_id, "method": method, "params": params}) + "\n").encode())
                        stream.flush()
                        while True:
                            if time.monotonic() > deadline:
                                raise TimeoutError("Date search timed out")
                            line = stream.readline(1048577)
                            if not line or len(line) > 1048576:
                                raise ValueError("Invalid Electrum response")
                            payload = json.loads(line)
                            if payload.get("id") == request_id:
                                if payload.get("error"):
                                    raise ValueError("Electrum request failed")
                                return payload["result"]
                    rpc("server.version", ["Umbrel Frigate setup", "1.4"])
                    tip_info = rpc("blockchain.headers.subscribe", [])
                    tip = tip_info["height"]
                    tip_time = int.from_bytes(bytes.fromhex(tip_info["hex"])[68:72], "little")
                    if tip < floor or tip_time < target:
                        raise ValueError("Date is beyond the available chain")
                    if os.environ.get("APP_BITCOIN_NETWORK", "mainnet") == "mainnet" and tip_time < time.time() - 86400:
                        raise ValueError("Electrs tip is stale; wait for synchronization")
                    cache = {}
                    def header(height):
                        if height not in cache:
                            start = max(0, height - 10)
                            result = rpc("blockchain.block.headers", [start, height - start + 1])
                            raw = bytes.fromhex(result["hex"])
                            count = height - start + 1
                            if result["count"] != count or len(raw) != count * 80:
                                raise ValueError("Incomplete Electrum headers")
                            stamps = [int.from_bytes(raw[i + 68:i + 72], "little") for i in range(0, len(raw), 80)]
                            cache[height] = stamps[-1], sorted(stamps)[len(stamps) // 2]
                        return cache[height]
                    return search_height(target, tip, header, floor, deadline)

        DATE_SEARCH_LOCK = threading.Lock()

        def find_date(date):
            target = int(datetime.strptime(date, "%Y-%m-%d").replace(tzinfo=timezone.utc).timestamp())
            if target > time.time():
                raise ValueError("Fecha futura / Future date")
            floor = 709632 if os.environ.get("APP_BITCOIN_NETWORK", "mainnet") == "mainnet" else 0
            results = queue.Queue()
            deadline = time.monotonic() + 30
            def worker(name, searcher):
                try:
                    height, timestamp = searcher(target, floor, deadline)
                    results.put({"height": height, "source": name, "block_time": datetime.fromtimestamp(timestamp, timezone.utc).strftime("%Y-%m-%d %H:%M:%S")})
                except Exception:
                    # Never return RPC URLs, credentials or backend exception bodies.
                    results.put(None)
            for name, searcher in (("Bitcoin Core", find_with_core), ("Electrs", find_with_electrum)):
                threading.Thread(target=worker, args=(name, searcher), daemon=True).start()
            for _ in range(2):
                try:
                    result = results.get(timeout=max(0.01, deadline - time.monotonic()))
                except queue.Empty:
                    break
                if result is not None:
                    return result
            raise ValueError("No se pudo resolver la fecha. Comprueba que Bitcoin Core o Electrs estén disponibles y sincronizados. / Could not resolve date; check backend availability and synchronization.")

        class Handler(BaseHTTPRequestHandler):
            def language(self):
                return select_language(self.headers.get("Accept-Language", ""))

            def do_GET(self):
                lang = self.language()
                if urlsplit(self.path).path == "/api/block-date":
                    if not DATE_SEARCH_LOCK.acquire(blocking=False):
                        self.respond_json({"error": "Búsqueda en curso / Search in progress"}, 429)
                        return
                    try:
                        date = parse_qs(urlsplit(self.path).query).get("date", [""])[0]
                        self.respond_json(find_date(date))
                    except ValueError as error:
                        self.respond_json({"error": str(error)}, 400)
                    finally:
                        DATE_SEARCH_LOCK.release()
                    return
                if self.path.startswith("/config"):
                    self.respond(page(tr(lang, "title_config"), config_body(lang), lang, refresh=False))
                else:
                    setup = read_settings()["SETUP_REQUIRED"] == "true"
                    self.respond(page(tr(lang, "title_config" if setup else "title_status"), status_body(lang), lang, refresh=not setup))

            def do_POST(self):
                if not self.path.startswith("/config"):
                    self.send_error(404)
                    return
                lang = self.language()
                try:
                    length = int(self.headers.get("content-length", "0"))
                except ValueError:
                    self.send_error(400)
                    return
                form = parse_qs(self.rfile.read(length).decode(), keep_blank_values=True)
                old = read_settings()
                new = DEFAULTS.copy()
                for key in DEFAULTS:
                    new[key] = form.get(key, [old.get(key, DEFAULTS[key])])[0].strip()
                invalid = validate_settings(new)
                if invalid:
                    message = tr(lang, "invalid_setting").format(field=tr(lang, f"field_{invalid}_label"))
                    self.respond(page(tr(lang, "title_config"), config_body(lang, message, new), lang, refresh=False))
                    return
                new["SETUP_REQUIRED"] = "false"
                new["AUTO_PROFILE"] = "true" if old["SETUP_REQUIRED"] == "true" else "false"
                write_settings(new)
                if old["SETUP_REQUIRED"] == "true":
                    message = "Configuración confirmada. Frigate comenzará la indexación desde la altura elegida." if lang == "es" else "Setup confirmed. Frigate will begin indexing from the selected height."
                    self.respond(page(tr(lang, "title_status"), status_body(lang, message), lang))
                    return
                if old["SETUP_REQUIRED"] != "true":
                    RESTART_FILE.write_text(str(int(time.time())) + "\n")
                if new["START_HEIGHT"] != old["START_HEIGHT"]:
                    message = tr(lang, "saved_start_height")
                else:
                    message = tr(lang, "saved_restart")
                self.respond(page(tr(lang, "title_config"), config_body(lang, message), lang, refresh=False))

            def respond(self, html):
                data = html.encode()
                self.send_response(200)
                self.send_header("content-type", "text/html; charset=utf-8")
                self.send_header("content-length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def respond_json(self, payload, status=200):
                data = json.dumps(payload).encode()
                self.send_response(status)
                self.send_header("content-type", "application/json")
                self.send_header("content-length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def log_message(self, *_):
                return

        ensure_settings()
        ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()
    volumes:
      - ${APP_DATA_DIR}/data/frigate:/data/frigate
      - ${TOR_DATA_DIR}:/tor-data:ro
    environment:
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK}"
      APP_FRIGATE_ELECTRUM_PORT: "${APP_FRIGATE_ELECTRUM_PORT}"
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      APP_BITCOIN_NODE_IP: "${APP_BITCOIN_NODE_IP}"
      APP_BITCOIN_RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      APP_BITCOIN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      APP_BITCOIN_RPC_PASS: "${APP_BITCOIN_RPC_PASS}"
      APP_ELECTRS_NODE_IP: "${APP_ELECTRS_NODE_IP}"
      APP_ELECTRS_NODE_PORT: "${APP_ELECTRS_NODE_PORT}"
    networks:
      default:
        ipv4_address: $APP_FRIGATE_WEB_IP

  frigate:
    image: debian:bookworm-slim
    restart: always
    stop_grace_period: 2m
    command: |
      sh -c '
      set -eu
      umask 077
      FRIGATE_VERSION="$${FRIGATE_VERSION:-1.6.1}"
      runtime_dir="/data/frigate/runtime"
      settings_file="/data/frigate/settings.env"
      mkdir -p /data/frigate
      read_setting() {
        sed -n "s/^$${1}=//p" "$${settings_file}" | tail -n 1 | tr -d "\r"
      }
      # The web service is the only creator of settings (atomic rename).
      # Legacy settings have no SETUP_REQUIRED flag and continue unchanged.
      while [ ! -f "$${settings_file}" ]; do sleep 2; done
      while [ "$$(read_setting SETUP_REQUIRED)" = "true" ]; do sleep 2; done
      arch="$$(dpkg --print-architecture)"
      case "$${arch}" in
        amd64) frigate_arch="x86_64"; frigate_sha256="ebddc2f7396035459dd94c8e04bfdccf2332506d907f949d67351fb47c6fbc2f" ;;
        arm64) frigate_arch="aarch64"; frigate_sha256="32d97ebc74581cee101fe8a03613e1de4b59ddd03ff46553bf17702a4eea72f5" ;;
        *) echo "Unsupported architecture: $${arch}" >&2; exit 1 ;;
      esac
      install_dir="$${runtime_dir}/frigate-$${FRIGATE_VERSION}-$${frigate_arch}"
      if [ ! -x "$${install_dir}/bin/frigate" ]; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl tar
        rm -rf /var/lib/apt/lists/*
        tmp_file="/tmp/frigate.tar.gz"
        rm -rf "$${install_dir}"
        mkdir -p "$${install_dir}"
        curl --retry 3 --retry-delay 2 -fsSL -o "$${tmp_file}" "https://github.com/sparrowwallet/frigate/releases/download/$${FRIGATE_VERSION}/frigate-$${FRIGATE_VERSION}-$${frigate_arch}.tar.gz"
        echo "$${frigate_sha256}  $${tmp_file}" | sha256sum -c -
        tar -xzf "$${tmp_file}" -C "$${install_dir}" --strip-components=1
        rm -f "$${tmp_file}"
      fi
      for old_dir in "$${runtime_dir}"/frigate-*; do
        if [ ! -d "$${old_dir}" ]; then continue; fi
        if [ "$${old_dir}" = "$${install_dir}" ]; then continue; fi
        rm -rf "$${old_dir}"
      done
      while true; do
        START_HEIGHT="$$(read_setting START_HEIGHT)"
        CACHE_SIZE="$$(read_setting CACHE_SIZE)"
        COMPUTE_BACKEND="$$(read_setting COMPUTE_BACKEND)"
        DB_THREADS="$$(read_setting DB_THREADS)"
        MEMORY_LIMIT="$$(read_setting MEMORY_LIMIT)"
        BATCH_SIZE="$$(read_setting BATCH_SIZE)"
        MAX_LABELS="$$(read_setting MAX_LABELS)"
        MAX_SUBSCRIPTIONS="$$(read_setting MAX_SUBSCRIPTIONS)"
        METRICS_ENABLED="$$(read_setting METRICS_ENABLED)"
        RPC_REQUEST_TIMEOUT_SECONDS="$$(read_setting RPC_REQUEST_TIMEOUT_SECONDS)"
        RPC_BATCH_SIZE="$$(read_setting RPC_BATCH_SIZE)"
        initial_profile="0"
        if [ "$$(read_setting AUTO_PROFILE)" = "true" ] && [ ! -f /data/frigate/.efficient-profile ]; then
          initial_profile="1"
          # Only boost untouched defaults; honor custom values from the wizard.
          if [ "$${CACHE_SIZE}" = "1M" ]; then CACHE_SIZE="10M"; fi
          if [ "$${MEMORY_LIMIT}" = "1GB" ]; then MEMORY_LIMIT="2GB"; fi
        fi
        network="$${APP_BITCOIN_NETWORK:-mainnet}"
        home_dir="/data/frigate"
        config_dir="$${home_dir}"
        network_args=""
        if [ "$${network}" != "mainnet" ]; then
          config_dir="$${home_dir}/$${network}"
          network_args="-n $${network}"
        fi
        mkdir -p "$${config_dir}"
        banner_file="$${config_dir}/banner.txt"
        if [ ! -f "$${banner_file}" ]; then
          printf "%s" "" | base64 -d > "$${banner_file}"
        fi
        desired_start_height="$${START_HEIGHT:-}"
        case "$${desired_start_height}" in
          *[!0-9]*|0?*) echo "Invalid START_HEIGHT value: $${desired_start_height}" >&2; exit 1 ;;
        esac
        start_height_marker="$${config_dir}/.umbrel-start-height"
        marker_value="$${desired_start_height:-default}"
        if [ "$$(cat "$${start_height_marker}" 2>/dev/null || true)" != "$${marker_value}" ]; then
          rm -rf "$${config_dir}/db"
          printf "%s" "$${marker_value}" > "$${start_height_marker}"
        fi
        {
          printf "%s\n" "[core]"
          printf "%s\n" "connect = true"
          printf "%s\n" "server = \"http://$${APP_BITCOIN_NODE_IP}:$${APP_BITCOIN_RPC_PORT}\""
          printf "%s\n" "authType = \"USERPASS\""
          printf "%s\n" "auth = \"$${APP_BITCOIN_RPC_USER}:$${APP_BITCOIN_RPC_PASS}\""
          if [ -n "$${APP_BITCOIN_ZMQ_SEQUENCE_PORT:-}" ]; then printf "%s\n" "zmqSequenceEndpoint = \"tcp://$${APP_BITCOIN_NODE_IP}:$${APP_BITCOIN_ZMQ_SEQUENCE_PORT}\""; fi
          printf "%s\n" "rpcRequestTimeoutSeconds = $${RPC_REQUEST_TIMEOUT_SECONDS:-60}"
          printf "%s\n" "rpcBatchSize = $${RPC_BATCH_SIZE:-100}"
          printf "%s\n" ""
          printf "%s\n" "[index]"
          if [ -n "$${desired_start_height}" ]; then printf "%s\n" "startHeight = $${desired_start_height}"; fi
          printf "%s\n" "cacheSize = \"$${CACHE_SIZE:-10M}\""
          printf "%s\n" ""
          printf "%s\n" "[scan]"
          printf "%s\n" "computeBackend = \"$${COMPUTE_BACKEND:-AUTO}\""
          printf "%s\n" "maxLabels = $${MAX_LABELS:-10}"
          printf "%s\n" "maxSubscriptions = $${MAX_SUBSCRIPTIONS:-100}"
          printf "%s\n" "metricsEnabled = $${METRICS_ENABLED:-true}"
        } > "$${config_dir}/config.toml"
        if [ -n "$${DB_THREADS:-}" ]; then printf "dbThreads = %s\n" "$${DB_THREADS}" >> "$${config_dir}/config.toml"; fi
        if [ -n "$${MEMORY_LIMIT:-}" ]; then printf "memoryLimit = \"%s\"\n" "$${MEMORY_LIMIT}" >> "$${config_dir}/config.toml"; fi
        if [ -n "$${BATCH_SIZE:-}" ]; then printf "batchSize = %s\n" "$${BATCH_SIZE}" >> "$${config_dir}/config.toml"; fi
        {
          printf "%s\n" ""
          printf "%s\n" "[server]"
          printf "%s\n" "tcp = \"tcp://0.0.0.0:$${APP_FRIGATE_ELECTRUM_PORT}\""
          printf "%s\n" "bannerFile = \"banner.txt\""
          printf "%s\n" "backendElectrumServer = \"tcp://$${APP_ELECTRS_NODE_IP}:$${APP_ELECTRS_NODE_PORT}\""
          printf "%s\n" ""
          printf "%s\n" "[limits]"
          printf "%s\n" "maxConnections = 15"
          printf "%s\n" "maxConnectionsPerIp = 15"
          printf "%s\n" "maxSubscriptionsPerIp = 10000"
          printf "%s\n" "maxSubscriptions = 25000"
          if [ -n "$${APP_FRIGATE_TOR_IP:-}" ]; then
            printf "%s\n" "excludedSubnets = [\"127.0.0.1/32\", \"::1/128\", \"$${APP_FRIGATE_TOR_IP}/32\"]"
          else
            printf "%s\n" "excludedSubnets = [\"127.0.0.1/32\", \"::1/128\"]"
          fi
        } >> "$${config_dir}/config.toml"
        chmod 600 "$${config_dir}/config.toml"
        rm -f "$${home_dir}/frigate.log" "$${config_dir}/frigate.log" "$${home_dir}/.service-ready"
        "$${install_dir}/bin/frigate" -d "$${home_dir}" $${network_args} &
        frigate_pid="$$!"
        restart_requested="0"
        while kill -0 "$${frigate_pid}" 2>/dev/null; do
          if [ ! -f "$${home_dir}/.service-ready" ] && grep -q "Electrum server listening" "$${home_dir}/frigate.log" "$${config_dir}/frigate.log" 2>/dev/null; then
            touch "$${home_dir}/.service-ready"
            if [ "$${initial_profile}" = "1" ] && [ "$$(read_setting AUTO_PROFILE)" = "true" ]; then
              touch "$${home_dir}/.efficient-profile"
              touch "$${home_dir}/.restart-requested"
            fi
          fi
          if [ -f "$${home_dir}/.restart-requested" ]; then
            restart_requested="1"
            rm -f "$${home_dir}/.restart-requested"
            kill "$${frigate_pid}" 2>/dev/null || true
            wait "$${frigate_pid}" 2>/dev/null || true
            break
          fi
          sleep 2
        done
        if [ "$${restart_requested}" = "1" ]; then
          continue
        fi
        wait "$${frigate_pid}"
        exit "$${?}"
      done
      '
    volumes:
      - ${APP_DATA_DIR}/data/frigate:/data/frigate
    environment:
      APP_VERSION: "${APP_VERSION}"
      FRIGATE_VERSION: "1.6.1"
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK}"
      APP_BITCOIN_NODE_IP: "${APP_BITCOIN_NODE_IP}"
      APP_BITCOIN_RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      APP_BITCOIN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      APP_BITCOIN_RPC_PASS: "${APP_BITCOIN_RPC_PASS}"
      APP_BITCOIN_ZMQ_SEQUENCE_PORT: "${APP_BITCOIN_ZMQ_SEQUENCE_PORT}"
      APP_ELECTRS_NODE_IP: "${APP_ELECTRS_NODE_IP}"
      APP_ELECTRS_NODE_PORT: "${APP_ELECTRS_NODE_PORT}"
      APP_FRIGATE_ELECTRUM_PORT: "${APP_FRIGATE_ELECTRUM_PORT}"
      APP_FRIGATE_TOR_IP: "${APP_FRIGATE_TOR_IP}"
    ports:
      - "${APP_FRIGATE_ELECTRUM_PORT}:${APP_FRIGATE_ELECTRUM_PORT}"

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    depends_on:
      - frigate
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: $APP_FRIGATE_TOR_IP
