version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: albercoin-store-simplex-chat-cli_server_1
      APP_PORT: 2191
  server:
    image: ghcr.io/albercoindev/simplex-chat-cli:1.0.4@sha256:3a367038894d8845cdecd885b0a244c4d36618d975d70cec7338383a19cd1eda
    hostname: simplex-chat-cli-web
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_PASSWORD: "${APP_PASSWORD}"
      PYTHONUNBUFFERED: "1"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2191/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
