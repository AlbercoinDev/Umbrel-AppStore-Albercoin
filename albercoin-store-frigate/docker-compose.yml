        def select_language(header):
            for part in (header or "").split(","):
                code = part.split(";", 1)[0].strip().lower()
                if code.startswith("es"):
                    return "es"
                if code.startswith("en"):
                    return "en"
            return "en"

        def tr(lang, key):
            return TEXT.get(lang, TEXT["en"]).get(key, TEXT["en"].get(key, key))

        def ensure_settings():
            DATA_DIR.mkdir(parents=True, exist_ok=True)
            if not SETTINGS_FILE.exists():
                write_settings(DEFAULTS)

        def read_settings():
            ensure_settings()
            values = DEFAULTS.copy()
            # Missing flags identify installations created before the setup wizard.
            values.update(SETUP_REQUIRED="false", AUTO_PROFILE="false")
            for line in SETTINGS_FILE.read_text().splitlines():
                if not line or line.startswith("#") or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                if key in values:
                    values[key] = value.strip()
            return values

        def write_settings(values):
            DATA_DIR.mkdir(parents=True, exist_ok=True)
            lines = []
            for key in DEFAULTS:
                value = str(values.get(key, DEFAULTS[key])).strip()
                value = value.replace("\n", "").replace("\r", "")
                lines.append(f"{key}={value}")
            tmp_file = SETTINGS_FILE.with_name(SETTINGS_FILE.name + ".tmp")
            tmp_file.write_text("\n".join(lines) + "\n")
            os.replace(tmp_file, SETTINGS_FILE)
            try:
                os.chmod(SETTINGS_FILE, 0o600)
            except OSError:
                pass

        def validate_settings(values):
            def invalid(key, pattern):
                value = values.get(key, "")
                return bool(value) and re.fullmatch(pattern, value, re.IGNORECASE) is None

            if invalid("START_HEIGHT", r"0|[1-9][0-9]{0,8}"):
                return "START_HEIGHT"
            if invalid("CACHE_SIZE", r"[0-9]+(?:\.[0-9]+)?[KM]?"):
                return "CACHE_SIZE"
            if invalid("MEMORY_LIMIT", r"[0-9]+(?:\.[0-9]+)?(?:B|KB|MB|GB|TB|KIB|MIB|GIB|TIB|%)?"):
                return "MEMORY_LIMIT"
            for key in ("DB_THREADS", "BATCH_SIZE", "MAX_LABELS", "MAX_SUBSCRIPTIONS", "RPC_REQUEST_TIMEOUT_SECONDS", "RPC_BATCH_SIZE"):
                if invalid(key, r"0|[1-9][0-9]*"):
                    return key
            if values.get("COMPUTE_BACKEND") not in ("AUTO", "GPU", "CPU"):
                return "COMPUTE_BACKEND"
            if values.get("METRICS_ENABLED") not in ("true", "false"):
                return "METRICS_ENABLED"
            return None

        def read_log(path):
            try:
                if not path.exists():
                    return None
                # Bound RAM per visitor even when Frigate's unrotated log is large.
                with path.open("rb") as stream:
                    stream.seek(0, 2)
                    size = stream.tell()
                    stream.seek(max(0, size - 131072))
                    if size > 131072:
                        stream.readline()
                    return stream.read().decode(errors="replace").splitlines()
            except OSError:
                return None

        def latest_lines(lines, lang, limit=35):
            if lines is None:
                return tr(lang, "no_log")
            return "\n".join(lines[-limit:])

        def status_from_log(lines):
            if not lines:
                return "status_starting", "detail_starting"
            ready_index = -1
            error_index = -1
            for index, line in enumerate(lines):
                if "Electrum server listening" in line:
                    ready_index = index
                if "ERROR" in line.upper():
                    error_index = index
            if error_index > ready_index:
                return "status_attention", "detail_attention"
            if ready_index >= 0 or (DATA_DIR / ".service-ready").exists():
                return "status_ready", "detail_ready"
            return "status_indexing", "detail_indexing"

        def progress_info(lines, network, configured_start_height, is_ready, lang):
            default_start = 709632 if network == "mainnet" else 0
            start_height = int(configured_start_height) if configured_start_height.isdigit() else default_start
            start_label = f"{start_height}" if configured_start_height else f"{start_height} ({tr(lang, 'default_suffix')})"
            if is_ready:
                return "100.00%", "100", start_label, tr(lang, "status_ready"), tr(lang, "status_ready")
            if lines is None:
                return tr(lang, "calculating"), None, start_label, tr(lang, "calculating"), tr(lang, "calculating")
            indexed_height = None
            tip_height = None
            for line in lines:
                match = re.search(r"Indexing \d+ blocks \((\d+) to (\d+)\)", line)
                if match:
                    tip_height = int(match.group(2))
                match = re.search(r"Indexing progress: (\d+) / (\d+) blocks \([\d.]+%, height (\d+)\)", line)
                if match:
                    indexed_height = int(match.group(3))
                    tip_height = indexed_height + int(match.group(2)) - int(match.group(1))
            if indexed_height is None or tip_height is None or tip_height <= start_height:
                return tr(lang, "calculating"), None, start_label, tr(lang, "calculating"), str(tip_height) if tip_height is not None else tr(lang, "calculating")
            percent = max(0.0, min(100.0, ((indexed_height - start_height) / (tip_height - start_height)) * 100.0))
            return f"{percent:.2f}%", f"{percent:.2f}", start_label, str(indexed_height), str(tip_height)

        def page(title, body, lang, refresh=True):
