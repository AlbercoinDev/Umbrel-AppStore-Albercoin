name: Build SimpleX Chat CLI
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the 1.0.4 image to GHCR (explicit manual action)"
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: simplex-chat-cli-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        working-directory: ./albercoin-store-simplex-chat-cli
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser DOM regression tests
        run: |
          npm install --prefix "$RUNNER_TEMP/simplex-ui" jsdom@26
          NODE_PATH="$RUNNER_TEMP/simplex-ui/node_modules" node albercoin-store-simplex-chat-cli/tests/ui.cjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./albercoin-store-simplex-chat-cli
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: ghcr.io/albercoindev/simplex-chat-cli:1.0.4
          provenance: true
          sbom: true
          cache-from: type=gha,scope=simplex-chat-cli
          cache-to: type=gha,scope=simplex-chat-cli,mode=max
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ inputs.publish }}
        run: |
          echo "Published: ${PUBLISHED}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
