        <script>
          function copyValue(value, button) {{
            function done() {{ const old = button.textContent; button.textContent = '{escape(tr(lang, "copied"))}'; setTimeout(() => button.textContent = old, 1200); }}
            function fallback() {{
              const area = document.createElement('textarea');
              area.value = value;
              area.setAttribute('readonly', '');
              area.style.position = 'fixed';
              area.style.opacity = '0';
              document.body.appendChild(area);
              area.select();
              try {{ document.execCommand('copy'); done(); }} catch (error) {{}}
              document.body.removeChild(area);
            }}
            if (navigator.clipboard && window.isSecureContext) {{ navigator.clipboard.writeText(value).then(done).catch(fallback); return; }}
