manifestVersion: 1.1
id: albercoin-store-umbrel-tunnel
storage:
  dataRoot: data
category: networking
name: Umbrel Tunnel
version: "1.6.3"
tagline: Expose Umbrel services through your own VPS over WireGuard
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-umbrel-tunnel/icon.svg
description: >-
  Umbrel Tunnel connects your Umbrel to a VPS with a fixed public IP through a
  WireGuard tunnel. The app detects installed apps and UmbrelOS services, lets
  you choose which ports to expose, and opens or closes the matching public
  ports on the VPS. The VPS control API only listens inside the tunnel and is
  protected by a Bearer token. The interface is available in Spanish (default)
  and English, and follows the browser/UmbrelOS language on first open.


  Requirements: a Debian 12/13 or Ubuntu Server 22.04/24.04+ VPS (amd64/arm64)
  with a fixed public IP. Run the one-line installer on the VPS, then paste the
  pairing code in the app.
releaseNotes: >-
  Security release. Release artifacts are now signed: SHA256SUMS has an
  Ed25519 signature and both the installer and `umbrel-tunnel update` verify it
  before running or installing anything, so a compromised download server or
  GitHub release cannot swap the binary and its checksum together. The
  installer snapshots the firewall and schedules an automatic rollback after
  120 s unless you confirm with `umbrel-tunnel firewall confirm`; `--harden-ssh`
  optionally disables password logins when authorized keys exist. Adds real
  per-publication health checks: TCP every 60 s, HTTP HEAD for web targets and
  UDP reported as "no data" instead of guessed. Update the VPS first to 1.6.3.
developer: AlbercoinDev
website: https://github.com/AlbercoinDev/umbrel-tunnel
dependencies: []
repo: https://github.com/AlbercoinDev/umbrel-tunnel
support: https://github.com/AlbercoinDev/umbrel-tunnel/issues
port: 8642
backupIgnore:
  - data/haproxy.cfg
widgets:
  - id: "status"
    type: "three-stats"
    refresh: "30s"
    endpoint: "gateway:8081/api/widget"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - icon: "route"
          text: "Connected"
          subtext: "handshake 42s ago"
        - icon: "server-2"
          text: "2/3"
          subtext: "services healthy"
        - icon: "world"
          text: "example.com"
          subtext: "public domain"
gallery: []
path: ""
deterministicPassword: true
torOnly: false
submitter: AlbercoinDev
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
