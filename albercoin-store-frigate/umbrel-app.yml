manifestVersion: 1
id: albercoin-store-frigate
category: bitcoin
name: Frigate
version: "1.6.1-09"
tagline: Electrum server for Silent Payments
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-frigate/icon.png
description: >-
  Frigate is an Electrum server for Bitcoin Silent Payments (BIP352).
  It performs Silent Payments scanning server-side using ephemeral client keys,
  returning discovered transactions over an extension to the Electrum JSON-RPC
  protocol.


  This Umbrel package connects Frigate to your Bitcoin Core node and uses your
  Electrs app as the backend for non-Silent Payments Electrum requests. Wallets
  should connect directly to Frigate on port 50005.
developer: Sparrow Wallet
website: https://sparrowwallet.com/
dependencies:
  - bitcoin
  - electrs
repo: https://github.com/sparrowwallet/frigate
support: https://github.com/sparrowwallet/frigate/issues
port: 2125
gallery:
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-frigate/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Umbrel package revision 09 for Frigate 1.6.1.


  New installations wait for explicit setup confirmation before starting Frigate.
  Choose complete history, a custom block height, or find a height by UTC date
  using the first successful local Bitcoin Core or Electrs search.


  Initial indexing temporarily uses a larger cache and DuckDB memory pool, then
  restarts once into an efficient profile (1M cache, 1GB DuckDB pool, two CPU
  threads). Existing settings are preserved. Small-server connection and
  subscription limits and bounded dashboard log reads reduce resource exposure.
  Memory pool limits are not total application RAM limits. No index rebuild is
  required for this update.
submitter: AlbercoinDev
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
backupIgnore:
  - data/frigate/db
  - data/frigate/*/db
  - data/frigate/runtime
  - data/frigate/cache
  - data/frigate/*/cache
  - data/frigate/config.toml
  - data/frigate/*/config.toml
  - data/frigate/frigate.log
  - data/frigate/*/frigate.log
