              if (copy) copy.onclick = () => {{ const el = document.getElementById('frigate-log'); if (el) copyValue(el.innerText, copy); }};
              const end = document.querySelector('#status-panel .log-end');
              if (end) end.onclick = () => {{ const el = document.getElementById('frigate-log'); if (el) el.scrollTop = el.scrollHeight; }};
            }}
            bindLogs();
            let refreshing = false;
            async function refreshPanel() {{
              if (refreshing) return;
              refreshing = true;
              try {{
                const response = await fetch(window.location.href, {{cache: 'no-store'}});
                if (!response.ok) return;
                const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
                const panel = document.getElementById('status-panel');
                const next = doc.getElementById('status-panel');
                if (!panel || !next) return;
                if (logsHover) return;
                const selection = window.getSelection();
                if (selection && !selection.isCollapsed && selection.anchorNode && panel.contains(selection.anchorNode)) return;
                const focused = document.activeElement;
                if (focused && focused.closest && focused.closest('#status-panel .logs')) return;
                const pre = document.getElementById('frigate-log');
                const nextPre = next.querySelector('#frigate-log');
                const follow = pre ? pre.scrollHeight - pre.clientHeight - pre.scrollTop < 24 : true;
                const top = pre ? pre.scrollTop : 0;
                if (pre && nextPre && !follow) nextPre.textContent = pre.textContent;
                panel.replaceChildren(...next.childNodes);
                bindLogs();
                const updated = document.getElementById('frigate-log');
                if (updated && !follow) updated.scrollTop = top;
              }} catch (error) {{ /* keep the last visible state */ }}
              finally {{ refreshing = false; }}
            }}
