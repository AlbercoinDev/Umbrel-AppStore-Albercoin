services:
  app_proxy:
    environment:
      APP_HOST: e-lite
      APP_PORT: 3000

  app:
    image: ghcr.io/albercoindev/e-lite:0.1.0-alpha.29.6.0-01@sha256:362767723de6282af534b8a819f53f5947a7f0665b5bf40abae5367cefb66b0b
    user: "1000:1000"
    hostname: e-lite
    init: true
    restart: on-failure
    stop_grace_period: 5m
    sysctls:
      # Keep ephemeral source ports below the Electrum listeners so an
      # outgoing Core/Tor connection cannot collide with a TLS bind.
      net.ipv4.ip_local_port_range: "32768 54000"
    ulimits:
      # e-lite caps RocksDB max_open_files at ulimit-64. Docker defaults to
      # 1024, which would leave ~960 and negate the 29.4.4 index improvement.
      nofile:
        soft: 8192
        hard: 8192
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      E_LITE_DATA_ROOT: /data
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - "55011:55011"
      - "55022:55022"
      - "55111:55111"
      - "55122:55122"
      - "55211:55211"
      - "55222:55222"
