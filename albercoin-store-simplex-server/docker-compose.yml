version: "3.7"
services:
  app_proxy:
    networks: [default, simplex_private]
    environment:
      APP_HOST: albercoin-store-simplex-server_server_1
      APP_PORT: 2193
  server:
    networks: [simplex_private]
    # Development reference: publish and pin the resulting multiarch digest before release.
    image: ghcr.io/albercoindev/simplex-server:0.1.0
    init: true
    restart: on-failure
    stop_grace_period: 2m
    ports:
      - "5223:5223"
    environment:
      APP_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data/manager:/data
      - ${APP_DATA_DIR}/data/smp/config:/etc/opt/simplex
      - ${APP_DATA_DIR}/data/smp/state:/var/opt/simplex
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2193/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  simplex_private:
