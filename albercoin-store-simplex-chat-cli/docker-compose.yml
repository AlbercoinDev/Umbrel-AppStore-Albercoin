version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: albercoin-store-simplex-chat-cli_server_1
      APP_PORT: 2191
  server:
    image: ghcr.io/albercoindev/simplex-chat-cli:1.0.1@sha256:8e21433c28eb33cae77458fbbb2118f6fbf0341421053813babc9e9429e3b82b
    hostname: simplex-chat-cli-web
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      APP_PASSWORD: "${APP_PASSWORD}"
      PYTHONUNBUFFERED: "1"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
