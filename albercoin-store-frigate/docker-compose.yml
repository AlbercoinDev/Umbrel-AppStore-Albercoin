        def select_language(header):
            for part in (header or "").split(","):
                code = part.split(";", 1)[0].strip().lower()
                if code.startswith("es"):
                    return "es"
                if code.startswith("en"):
                    return "en"
            return "en"

        def tr(lang, key):
            return TEXT.get(lang, TEXT["en"]).get(key, TEXT["en"].get(key, key))

        def ensure_settings():
            DATA_DIR.mkdir(parents=True, exist_ok=True)
            if not SETTINGS_FILE.exists():
                write_settings(DEFAULTS)

        def read_settings():
            ensure_settings()
            values = DEFAULTS.copy()
            # Missing flags identify installations created before the setup wizard.
            values.update(SETUP_REQUIRED="false", AUTO_PROFILE="false")
            for line in SETTINGS_FILE.read_text().splitlines():
                if not line or line.startswith("#") or "=" not in line:
                    continue
                key, value = line.split("=", 1)
                if key in values:
                    values[key] = value.strip()
            return values

        def write_settings(values):
            DATA_DIR.mkdir(parents=True, exist_ok=True)
            lines = []
            for key in DEFAULTS:
                value = str(values.get(key, DEFAULTS[key])).strip()
                value = value.replace("\n", "").replace("\r", "")
                lines.append(f"{key}={value}")
            tmp_file = SETTINGS_FILE.with_name(SETTINGS_FILE.name + ".tmp")
            tmp_file.write_text("\n".join(lines) + "\n")
            os.replace(tmp_file, SETTINGS_FILE)
            try:
                os.chmod(SETTINGS_FILE, 0o600)
            except OSError:
                pass

        def validate_settings(values):
            def invalid(key, pattern):
                value = values.get(key, "")
                return bool(value) and re.fullmatch(pattern, value, re.IGNORECASE) is None

            if invalid("START_HEIGHT", r"0|[1-9][0-9]{0,8}"):
                return "START_HEIGHT"
            if invalid("CACHE_SIZE", r"[0-9]+(?:\.[0-9]+)?[KM]?"):
                return "CACHE_SIZE"
            if invalid("MEMORY_LIMIT", r"[0-9]+(?:\.[0-9]+)?(?:B|KB|MB|GB|TB|KIB|MIB|GIB|TIB|%)?"):
                return "MEMORY_LIMIT"
            for key in ("DB_THREADS", "BATCH_SIZE", "MAX_LABELS", "MAX_SUBSCRIPTIONS", "RPC_REQUEST_TIMEOUT_SECONDS", "RPC_BATCH_SIZE"):
                if invalid(key, r"0|[1-9][0-9]*"):
                    return key
            if values.get("COMPUTE_BACKEND") not in ("AUTO", "GPU", "CPU"):
                return "COMPUTE_BACKEND"
            if values.get("METRICS_ENABLED") not in ("true", "false"):
                return "METRICS_ENABLED"
            return None

        def current_run(lines):
            # Ignore records from earlier runs now that the log survives restarts.
            try:
                start = (DATA_DIR / ".run-start").read_text(encoding="utf-8", errors="replace").strip()
            except OSError:
                return lines
            if re.fullmatch(r"\d{4}-\d\d-\d\d \d\d:\d\d:\d\d", start) is None:
                return lines
            result = []
            keep = False
            for line in lines:
                stamp = re.match(r"^(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)", line)
                if stamp:
                    keep = stamp.group(1) >= start
                if keep:
                    result.append(line)
            return result

        def read_log(path):
            try:
                if not path.exists():
                    return None
                # Bound RAM per visitor even when Frigate's unrotated log is large.
                with path.open("rb") as stream:
                    stream.seek(0, 2)
                    size = stream.tell()
                    stream.seek(max(0, size - 131072))
                    if size > 131072:
                        stream.readline()
                    return current_run(stream.read().decode(errors="replace").splitlines())
            except OSError:
                return None

        def latest_lines(lines, lang, limit=1000):
            if not lines:
                return tr(lang, "no_log")
            return "\n".join(lines[-limit:])

        def status_from_log(lines):
            if not lines:
                return "status_starting", "detail_starting"
            ready_index = -1
            error_index = -1
            for index, line in enumerate(lines):
                if "Electrum server listening" in line:
                    ready_index = index
                if "ERROR" in line.upper():
                    error_index = index
            if error_index > ready_index:
                return "status_attention", "detail_attention"
            if ready_index >= 0 or (DATA_DIR / ".service-ready").exists():
                return "status_ready", "detail_ready"
            return "status_indexing", "detail_indexing"

        def read_state(name):
            try:
                data = json.loads((DATA_DIR / name).read_text(encoding="utf-8", errors="replace"))
            except (OSError, ValueError):
                return None
            return data if isinstance(data, dict) else None

        _WEB_PROBE = {"at": 0.0, "core": None}

        def web_probe():
            # What this container can reach. A lost Docker endpoint breaks a single
            # container, so comparing the same TCP probe from both sides separates a
            # node problem from an app container problem.
            now = time.monotonic()
            if now - _WEB_PROBE["at"] < 20:
                return _WEB_PROBE
            try:
                socket.create_connection((os.environ["APP_BITCOIN_NODE_IP"], int(os.environ["APP_BITCOIN_RPC_PORT"])), timeout=2).close()
                core_ok = True
            except Exception:
                core_ok = False
            _WEB_PROBE.update(at=now, core=core_ok)
            return _WEB_PROBE

        def log_shows_network_error(lines):
            # Fallback for installs whose entrypoint could not write .health.json
            # (for example when the very first download failed without a route).
            for line in (lines or [])[-200:]:
                if "Network is unreachable" in line or "No route to host" in line:
                    return True
            return False

        def diagnosis(lang, health, probe):
            code = (health or {}).get("code")
            if code is None:
                return ""
            if code in ("no_route", "no_host_route"):
                return tr(lang, "diag_no_network") if probe.get("core") else tr(lang, "diag_no_backend")
            if code == "ok":
                return "" if probe.get("core") else tr(lang, "diag_panel_no_network")
            return tr(lang, "diag_core_unreachable")

        def check_rows(lang, health, probe):
            labels = {"ok": tr(lang, "check_ok"), "no_route": tr(lang, "check_no_route"), "no_host_route": tr(lang, "check_no_route"), "refused": tr(lang, "check_refused"), "timeout": tr(lang, "check_timeout"), "other": tr(lang, "check_error"), "fail": tr(lang, "check_fail")}
            rows = []
            if health is not None:
                rows.append((tr(lang, "check_core"), labels.get(health.get("core"), str(health.get("core") or tr(lang, "check_unknown")))))
                rows.append((tr(lang, "check_tor"), labels.get(health.get("tor_dns"), str(health.get("tor_dns") or tr(lang, "check_unknown")))))
                rows.append((tr(lang, "check_at"), str(health.get("at") or tr(lang, "check_unknown"))))
            rows.append((tr(lang, "check_panel"), tr(lang, "check_ok") if probe.get("core") else tr(lang, "check_no_route")))
            return rows

        def progress_info(lines, network, configured_start_height, is_ready, lang):
            default_start = 709632 if network == "mainnet" else 0
            start_height = int(configured_start_height) if configured_start_height.isdigit() else default_start
            start_label = f"{start_height}" if configured_start_height else f"{start_height} ({tr(lang, 'default_suffix')})"
            if is_ready:
                return "100.00%", "100", start_label, tr(lang, "status_ready"), tr(lang, "status_ready")
            if lines is None:
                return tr(lang, "calculating"), None, start_label, tr(lang, "calculating"), tr(lang, "calculating")
            indexed_height = None
            tip_height = None
            for line in lines:
                match = re.search(r"Indexing \d+ blocks \((\d+) to (\d+)\)", line)
                if match:
                    tip_height = int(match.group(2))
                match = re.search(r"Indexing progress: (\d+) / (\d+) blocks \([\d.]+%, height (\d+)\)", line)
                if match:
                    indexed_height = int(match.group(3))
                    tip_height = indexed_height + int(match.group(2)) - int(match.group(1))
            if indexed_height is None or tip_height is None or tip_height <= start_height:
                return tr(lang, "calculating"), None, start_label, tr(lang, "calculating"), str(tip_height) if tip_height is not None else tr(lang, "calculating")
            percent = max(0.0, min(100.0, ((indexed_height - start_height) / (tip_height - start_height)) * 100.0))
            return f"{percent:.2f}%", f"{percent:.2f}", start_label, str(indexed_height), str(tip_height)

        def page(title, body, lang, refresh=True):
            # Pages never reload themselves; the status panel refreshes in place.
            return f'''<!doctype html>
        <html lang="{escape(lang)}">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{escape(title)}</title>
          <style>
            body {{ margin: 0; min-height: 100vh; background: #0b1020; color: #eaf6ff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 28px 0; }}
            main {{ width: min(980px, calc(100% - 124px)); padding: 42px; border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); box-shadow: 0 24px 80px rgba(0,0,0,.35); }}
            h1 {{ margin: 0 0 12px; font-size: clamp(34px, 7vw, 64px); line-height: 1; }}
            h2 {{ margin: 0 0 8px; font-size: 16px; color: #ffffff; }}
            p {{ color: #c6d8e8; font-size: 18px; line-height: 1.6; }}
            a, button {{ color: inherit; }}
            nav {{ display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 4px; }}
