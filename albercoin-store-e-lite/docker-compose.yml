services:
  app_proxy:
    environment:
      APP_HOST: albercoin-store-e-lite_app_1
      APP_PORT: 3000

  app:
    image: ghcr.io/albercoindev/e-lite:0.1.0-alpha.24-01@sha256:fc2fb07cf28d37e221476d0976c0bee13c677aaf47fe609687e86acdc275dafc
    user: "1000:1000"
    hostname: e-lite
    init: true
    restart: on-failure
    stop_grace_period: 5m
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      E_LITE_DATA_ROOT: /data
      E_LITE_ONION_FILE: /tor-data/app-albercoin-store-e-lite-electrum/hostname
      E_LITE_TOR_SOCKS: tor:9050
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${TOR_DATA_DIR}:/tor-data:ro
    ports:
      - "50011:50011"
      - "50012:50012"

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    depends_on:
      - app
    user: "1000:1000"
    init: true
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
