submitter: AlbercoinDev
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
dependencies: []
releaseNotes: >-
  Actualiza el runtime Python a la imagen 3.15-slim vigente y mantiene FastAPI
  0.163.1 y Uvicorn 0.54.0. No cambian el diagnóstico de CPU, los montajes de
  host ni el formato de los informes; no hay migración de datos.
