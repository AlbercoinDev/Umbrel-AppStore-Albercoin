services:
  app_proxy:
    environment:
      APP_HOST: e-lite
      APP_PORT: 3000

  app:
    image: ghcr.io/albercoindev/e-lite:0.1.0-alpha.29.4.3-01@sha256:0a270cd54a1da73757f5095d96958fda3d0593b37df233b1fe002f9bd8d4c797
    user: "1000:1000"
    hostname: e-lite
    init: true
    restart: on-failure
    stop_grace_period: 5m
    sysctls:
      # Keep ephemeral source ports below the Electrum listeners so an
      # outgoing Core/Tor connection cannot collide with a TLS bind.
      net.ipv4.ip_local_port_range: "32768 54000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      E_LITE_DATA_ROOT: /data
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - "55011:55011"
      - "55022:55022"
      - "55111:55111"
      - "55122:55122"
      - "55211:55211"
      - "55222:55222"
