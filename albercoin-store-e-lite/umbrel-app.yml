manifestVersion: 1.1
id: albercoin-store-e-lite
storage:
  dataRoot: data
category: bitcoin
name: e-lite
version: "0.1.0-alpha.29.8.0-01"
tagline: Servidor Electrum autónomo con Bitcoin Core incluido
description: >-
  e-lite es un servidor Electrum 1.4–1.7 autónomo que incluye su propio Bitcoin Core
  32.1 y puede ejecutar mainnet, testnet4 y signet a la vez. No depende de las
  apps Bitcoin ni Electrs de Umbrel. Cada red tiene sus propios puertos, Core,
  índice, certificado TLS y dirección onion.


  Mainnet usa 55011/55022, testnet4 55111/55122 y signet 55211/55222. El panel
  permite activar o desactivar cada red, ver su estado y configurar sus
  parámetros de forma independiente.


  Aviso: e-lite está en fase alpha. La primera sincronización puede tardar días
  y ocupar mucho disco. El TLS usa un certificado autofirmado. Los puertos
  Electrum no tienen autenticación de clientes; úsalos solo en redes de confianza.
releaseNotes: >-
  Actualiza e-lite a 0.1.0-alpha.29.8.0: watermarks de backlog en bytes,
  planificador Core/e-lite configurable y control de commits/lectores más
  estable. Añade al panel el backlog sin indexar y el modo del planificador;
  identifica correctamente discos montados en /data. Conserva datos, CA,
  certificados, puertos y onions.
developer: Albercoin
website: https://github.com/AlbercoinDev/e-lite
dependencies: []
repo: https://github.com/AlbercoinDev/e-lite
support: https://github.com/AlbercoinDev/e-lite/issues
port: 2194
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-e-lite/icon.svg
gallery:
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-e-lite/gallery/1.jpg
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-e-lite/gallery/2.jpg
  - https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-e-lite/gallery/3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Albercoin
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
widgets:
  - id: "status"
    type: "four-stats"
    refresh: "10s"
    endpoint: "app:3000/api/widget/status"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Redes"
          text: "2"
          subtext: "activas"
        - title: "Clientes"
          text: "2"
          subtext: "conectados"
        - title: "Altura"
          text: "184,250"
          subtext: "bloques"
        - title: "Lag"
          text: "0"
          subtext: "bloques"
  - id: "sync"
    type: "text-with-progress"
    refresh: "10s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Sincronización"
      text: "83%"
      progressLabel: "Indexando"
      progress: 0.83
backupIgnore:
  - data/runtime
  - data/networks
  - data/logs
  - data/bitcoin
  - data/e-lite
  - data/config/e-lite.toml
  - data/config/networks/*/tor/data
  - data/config/networks/*/tor/tor.log
