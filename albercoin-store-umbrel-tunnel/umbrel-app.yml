manifestVersion: 1.1
id: albercoin-store-umbrel-tunnel
storage:
  dataRoot: data
category: networking
name: Umbrel Tunnel
version: "1.6.1"
tagline: Expose Umbrel services through your own VPS over WireGuard
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-umbrel-tunnel/icon.svg
description: >-
  Umbrel Tunnel connects your Umbrel to a VPS with a fixed public IP through a
  WireGuard tunnel. The app detects installed apps and UmbrelOS services, lets
  you choose which ports to expose, and opens or closes the matching public
  ports on the VPS. The VPS control API only listens inside the tunnel and is
  protected by a Bearer token. The interface is available in Spanish (default)
  and English, and follows the browser/UmbrelOS language on first open.


  Requirements: a Debian 12/13 or Ubuntu Server 22.04/24.04+ VPS (amd64/arm64)
  with a fixed public IP. Run the one-line installer on the VPS, then paste the
  pairing code in the app.
releaseNotes: >-
  Security and umbrelOS 2.x update. Secrets at rest (config.json, the
  WireGuard private key, the persistent wg0.conf copy and pending rotations)
  are now encrypted with AES-256-GCM; the key lives in data/secrets.key and
  travels with app data, so restores keep working. Existing plaintext files
  are migrated automatically on first start. Manual targets are revalidated on
  every sync and the UDP relay pins an approved IP per session to stop DNS
  rebinding. Adds a home-screen widget with tunnel status, healthy services
  and the public domain, and marks regenerable haproxy.cfg as backup-ignored.
  The app works behind umbrelOS 2.x's in-process gateway without app_proxy.
  No changes to pairing, publications or VPS binaries; the VPS does not need
  to be updated. 1.6.1 fails closed if data/secrets.key is missing or corrupt
  instead of generating a new key that would make the stored data unreadable.
developer: AlbercoinDev
website: https://github.com/AlbercoinDev/umbrel-tunnel
dependencies: []
repo: https://github.com/AlbercoinDev/umbrel-tunnel
support: https://github.com/AlbercoinDev/umbrel-tunnel/issues
port: 8642
backupIgnore:
  - data/haproxy.cfg
widgets:
  - id: "status"
    type: "three-stats"
    refresh: "30s"
    endpoint: "gateway:8081/api/widget"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - icon: "route"
          text: "Connected"
          subtext: "handshake 42s ago"
        - icon: "server-2"
          text: "2/3"
          subtext: "services healthy"
        - icon: "world"
          text: "example.com"
          subtext: "public domain"
gallery: []
path: ""
deterministicPassword: true
torOnly: false
submitter: AlbercoinDev
submission: https://github.com/AlbercoinDev/Umbrel-AppStore-Albercoin
