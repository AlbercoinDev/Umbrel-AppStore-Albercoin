manifestVersion: 1.1
id: albercoin-store-umbrel-tunnel
storage:
  dataRoot: data
category: networking
name: Umbrel Tunnel
version: "1.5.0"
tagline: Expose Umbrel services through your own VPS over WireGuard
icon: https://raw.githubusercontent.com/AlbercoinDev/Umbrel-AppStore-Albercoin/master/albercoin-store-umbrel-tunnel/icon.svg
description: >-
  Umbrel Tunnel connects your Umbrel to a VPS with a fixed public IP through a
  WireGuard tunnel. The app detects installed apps and UmbrelOS services, lets
  you choose which ports to expose, and opens or closes the matching public
  ports on the VPS. The VPS control API only listens inside the tunnel and is
  protected by a Bearer token. The interface is available in Spanish (default)
  and English, and follows the browser/UmbrelOS language on first open.


  Requirements: a Debian 12/13 or Ubuntu Server 22.04/24.04+ VPS (amd64/arm64)
  with a fixed public IP. Run the one-line installer on the VPS, then paste the
  pairing code in the app.
releaseNotes: >-
  Shared VPS: several Umbrels can now use the same VPS, each with its own
  public domain. Two Umbrels can publish the same app on the same port
  (HTTPS on 443, or TLS such as Electrum on 50002) and the VPS routes each
  request by domain. Every Umbrel gets its own API token, sees and changes
  only its own publications, and cannot reach the other Umbrels through the
  tunnel. Plain TCP/UDP ports carry no domain, so each one still belongs to
  a single Umbrel. Existing single-Umbrel installs keep working unchanged.
  Update the VPS to 1.5.0 before updating this app.
developer: AlbercoinDev
